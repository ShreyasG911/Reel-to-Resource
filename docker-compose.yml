services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reel_to_resource_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/reel_to_resource
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-http://localhost:5000}
      - META_APP_ID=${META_APP_ID}
      - META_APP_SECRET=${META_APP_SECRET}
      - META_WEBHOOK_VERIFY_TOKEN=${META_WEBHOOK_VERIFY_TOKEN}
      - META_PAGE_ACCESS_TOKEN=${META_PAGE_ACCESS_TOKEN}
      - INSTAGRAM_ACCOUNT_ID=${INSTAGRAM_ACCOUNT_ID}
      - META_GRAPH_API_VERSION=${META_GRAPH_API_VERSION:-v21.0}
      - AUTO_REPLY_ENABLED=${AUTO_REPLY_ENABLED:-true}
      - SIMULATION_MODE=${SIMULATION_MODE:-false}
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:7
    container_name: reel_to_resource_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  mongo_data:
    driver: local

